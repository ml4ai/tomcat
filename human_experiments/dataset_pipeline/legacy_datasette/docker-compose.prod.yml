# Docker-compose file for Datasette interface
version: '3.7'

services:

  datasette:
    image: datasette-with-plugins
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    ports:
        - "8001:8001"
    volumes:
        - ${ARTIFACT_DIR:?set ARTIFACT_DIR (e.g. in .env)}:/mnt
        - .:/repo

    entrypoint: |
        datasette -p 8001 -h 0.0.0.0 -i /mnt/tomcat.db
        --reload
        --metadata /repo/metadata.yml
        --template-dir /repo/templates
        --plugins-dir /repo/plugins
        --inspect-file /repo/inspect-data.json
        --static assets:/repo/static
        --setting sql_time_limit_ms 10000
        --setting facet_time_limit_ms 10000
        --setting num_sql_threads 10
        --setting max_csv_mb 12000

  # NOTE: the Postgres-backed successor (datasette_interface/webapp/) is NOT a
  # Docker service. It runs as a systemd unit on orca next to the cluster -- see
  # deploy/tomcat-webapp.service and the webapp section of CLAUDE.md.
